[project]
name = 'agri-brain-backend'
version = '1.3.0'
description = 'Coordinator-mediated multi-agent research framework for synthetic perishable supply-chain routing'
# The publication lock and Slurm workflow are intentionally pinned to the
# Python 3.11 minor. Other minors are outside the certified evidence posture.
requires-python = ">=3.11,<3.12"
authors = [
    {name = "The AGRI-BRAIN Authors"},
]
keywords = [
    "multi-agent systems",
    "supply-chain simulation",
    "institutional retrieval",
    "reproducible research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    'fastapi>=0.135,<1',
    'uvicorn>=0.42,<1',
    'pydantic>=2.10,<3',
    'numpy>=2.1,<3',
    'pandas>=2.2,<3',
    'matplotlib>=3.10,<4',
    'reportlab>=4.4,<5',
    'pypdf>=6.16,<7',
    'orjson>=3.11,<4',
    'requests>=2.32,<3',
    'web3>=7.14,<8',
    'python-multipart>=0.0.22,<1',
    'pyyaml>=6.0,<7',
    # scipy is required by aggregate_seeds.py for the Wilcoxon and
    # Mann-Whitney significance tests. Both code paths have permutation
    # fallbacks, but without scipy the headline AB-vs-Static and
    # AB-vs-Hybrid-RL p-values used to silently return 1.0 from the
    # except clause; pinning scipy here ensures the HPC venv install
    # picks up the canonical implementation with the fallback acting
    # as a defensive backstop rather than the primary code path.
    'scipy>=1.11,<2',
]

[project.urls]
Repository = "https://github.com/kprodigi/AGRI-BRAIN"
Documentation = "https://github.com/kprodigi/AGRI-BRAIN#readme"
Issues = "https://github.com/kprodigi/AGRI-BRAIN/issues"

[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

# Explicit package discovery. Without this, setuptools' src-layout
# heuristic put only ``agribrain/backend/src`` on the editable install
# path, making ``import pirag`` work only as a side-effect of cwd or
# uvicorn's --app-dir flag. The 2026-05 packaging fix tells setuptools
# that the project root for discovery is ``agribrain/backend/`` itself
# (where this file lives) and exposes both top-level packages so
# editable installs reach them from any cwd.
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pirag*"]
exclude = ["tests*", "experiments*", "scripts*", "static*", "runtime*", "*.egg-info*"]

# Runtime resources must live inside an import package and be declared here.
# Editable installs can see adjacent repository files even when a wheel omits
# them, so these declarations are required for an installed-wheel deployment.
[tool.setuptools.package-data]
src = ["data_spinach.csv", "static/branding/*"]
pirag = [
    "configs/*.yaml",
    "configs/*.yml",
    "knowledge_base/*.txt",
    "knowledge_base/*.json",
    "knowledge_base/*.csv",
]

[project.optional-dependencies]
# Test/dev extras. ``httpx`` is required by Starlette's TestClient that
# the integration tests under ``agribrain/backend/tests`` use.
# ``pytest-asyncio`` is for the few async-flow tests under pirag.
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.legacy",
]
# Slow tests (full mode x scenario matrix over the simulator) are skipped
# by default and can be re-enabled with `pytest -m slow` or
# `pytest --override-ini="addopts="`.
addopts = "-m 'not slow'"
markers = [
    "slow: end-to-end simulator runs; minutes per test. Opt-in via -m slow.",
]
